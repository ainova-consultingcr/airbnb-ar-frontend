<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <!-- Configuración clave para dispositivos móviles -->
 <!-- VERSION: FIX-PROPERTY-08/01/2025 4:31 pm-OK -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <meta name="theme-color" content="#071018">
  <title>AVI | Asistente del hu&eacute;sped</title>

  <link rel="stylesheet" href="frontend/styles/base.css?v=20260727-1">
  <link rel="stylesheet" href="frontend/styles/shell.css?v=20260727-1">
  <link rel="stylesheet" href="frontend/styles/content-cards.css?v=20260727-1">
  <link rel="stylesheet" href="frontend/styles/guided-panels.css?v=20260727-1">
  <link rel="stylesheet" href="frontend/styles/composer.css?v=20260727-1">
  <link rel="stylesheet" href="frontend/styles/responsive.css?v=20260727-1">
</head>

<body>

  <header id="appHeader">
    <div class="avi-mark">AVI</div>
    <div class="avi-header-copy">
      <div id="propertyName">AVI</div>
      <div id="assistantStatus">Asistente disponible</div>
    </div>
  </header>

  <section id="responseCard" aria-live="polite">
    <div class="response-avatar">AI</div>
    <div class="response-body">
      <span id="responseLabel">AVI responde</span>
      <div id="responseLoading">
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
      </div>
      <div id="responseText"></div>
    </div>
  </section>

  <div id="bottomDock">
    <div id="experienceViews"></div>
    <div id="suggestions"></div>
    <div id="actionArea"></div>
    <div id="ui">
      <input
        id="questionInput"
        autocomplete="off"
        enterkeyhint="send"
        placeholder="Pregunta algo..."
      />
      <button id="sendBtn" type="button" onclick="askAI()">Enviar</button>
    </div>
  </div>

  <script src="frontend/shared/runtime.js?v=20260727-1"></script>
  <script src="frontend/shared/experience-views.js?v=20260727-1"></script>
  <script src="frontend/shared/conversation-context.js?v=20260727-1"></script>
  <script src="frontend/shared/form-controls.js?v=20260727-1"></script>
  <script src="frontend/shared/chat-ui.js?v=20260727-1"></script>
  <script src="frontend/shared/assistant-client.js?v=20260727-1"></script>

  <script src="frontend/shared/external-links.js?v=20260727-1"></script>
  <script src="frontend/experiences/hospitality/service-requests.js?v=20260727-1"></script>
  <script src="frontend/shared/analytics.js?v=20260727-1"></script>
  <script src="frontend/shared/bootstrap.js?v=20260727-1"></script>
</body>
</html>
